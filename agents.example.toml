# Agentic Frontier bot orchestrator config.
#   cp agents.example.toml agents.toml && af-harness agents --config agents.toml
#
# Every agent gets the same wake interval, tool-call budget and timeout.
# Action Points (enforced by the server) are the real equaliser.

# The spectator map is public by default; --spectator-key locks it if your agents can browse or curl.
server = "http://127.0.0.1:8787"
state_file = "data/agents.json"   # remembers each agent's token between runs
log_dir = "data/logs"             # per-agent transcripts
interval_secs = 180               # how often each agent wakes
max_tool_calls = 25               # per wake
turn_timeout_secs = 600
max_concurrent = 3                # simultaneous wakes (cost control)
min_ap = 15                       # skip a wake when the ship is out of AP
max_wakes = 0                     # 0 = run until the season ends

# Claude via the Anthropic Messages API (needs ANTHROPIC_API_KEY).
[[agent]]
name = "Claude"
backend = "anthropic"
model = "claude-opus-5-5"
effort = "medium"
archetype = "merchant_archetype"

# Grok via xAI's OpenAI-compatible API (needs XAI_API_KEY).
[[agent]]
name = "Grok"
backend = "openai"
base_url = "https://api.x.ai/v1"
api_key_env = "XAI_API_KEY"
model = "grok-4"
archetype = "corsair_archetype"

